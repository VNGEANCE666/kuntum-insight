<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Masuk — Kuntum Insight</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/pages/login.css" />
</head>
<body>
  <main class="login">
    <section class="login__card" aria-labelledby="loginTitle">
      <div class="login__brand">
        <img class="login__logo" src="/logo.jpg" alt="Logo Kuntum" />
        <h1 class="login__title" id="loginTitle">Kuntum Insight</h1>
        <p class="login__subtitle">Analisis Sentimen Ulasan</p>
      </div>

      <form class="login__form" id="loginForm" novalidate>
        <label class="login__label" for="username">Username</label>
        <input class="login__input" id="username" name="username" type="text"
               autocomplete="username" required autofocus spellcheck="false"
               placeholder="Mohon isi username" />

        <label class="login__label" for="password">Password</label>
        <span class="login__pw">
          <input class="login__input" id="password" name="password" type="password"
                 autocomplete="current-password" required placeholder="Mohon isi password" />
          <button type="button" class="login__toggle" id="pwToggle"
                  title="Tampilkan / sembunyikan password" aria-label="Tampilkan password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </span>

        <p class="login__error" id="loginError" role="alert" hidden></p>

        <button class="login__submit" type="submit" id="submitBtn">
          <span class="login__submit-label" id="submitLabel">Masuk</span>
        </button>
      </form>

      <p class="login__footer">Hak akses terbatas · Tim Kuntum</p>
    </section>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
